<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Support inbox · Nexora</title>
    <link rel="stylesheet" href="/workspace.css" />
    <script src="/network.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <aside id="sidebar" class="sidebar"></aside>
    <button
      class="mobile-scrim"
      data-menu="close"
      aria-label="Close navigation"
    ></button>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button subtle mobile-menu"
            data-menu="toggle"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <span data-icon="menu"></span>
          </button>
          <span>Workspace</span><span>/</span><span>Support inbox</span>
        </div>
        <div class="topbar-right">
          <time id="today"></time
          ><button class="header-signout" data-signout>Sign out</button>
        </div>
      </header>
      <main class="content" id="main">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Help for every journey</p>
            <h1>Support inbox</h1>
            <p>
              Review customer and driver requests. Replies appear in their
              support history.
            </p>
          </div>
          <button id="refresh">
            <span data-icon="refresh"></span>Refresh requests
          </button>
        </div>
        <p id="support-error" class="error-text" role="alert"></p>
        <div id="support-list"></div>
      </main>
    </div>
    <script src="/workspace.js"></script>
    <script src="/support-workspace.js"></script>
  </body>
</html>
